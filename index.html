<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Look-Hacker | Pro Simulator v5.0</title>
    <style>
        :root { --green: #00FF41; --dark: #050505; --red: #ff0000; }
        body { background: var(--dark); color: var(--green); font-family: 'Courier New', monospace; margin: 0; overflow: hidden; }
        
        /* High-Tech Button Panel */
        .control-panel { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); 
            gap: 8px; 
            padding: 15px; 
            background: #111; 
            border-bottom: 3px double var(--green);
        }
        button { 
            background: #000; border: 1px solid var(--green); color: var(--green); 
            padding: 8px; cursor: pointer; font-size: 0.7rem; transition: 0.3s;
            text-transform: uppercase;
        }
        button:hover { background: var(--green); color: #000; box-shadow: 0 0 15px var(--green); }
        .btn-red { border-color: var(--red); color: var(--red); }
        .btn-red:hover { background: var(--red); color: #000; box-shadow: 0 0 15px var(--red); }

        /* Full Screen Alert */
        .fs-note { font-size: 10px; text-align: center; color: #555; margin-bottom: 5px; }

        .view-container { position: relative; width: 100vw; height: 80vh; display: none; padding: 20px; box-sizing: border-box; }
        .active { display: block; }

        /* CCTV System (Idea 1) */
        .cctv-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; height: 100%; }
        .cam { border: 1px solid #333; position: relative; background: #000; overflow: hidden; }
        .cam::before { content: "REC ●"; position: absolute; top: 5px; left: 5px; color: red; font-size: 10px; }
        .cam-label { position: absolute; bottom: 5px; right: 5px; font-size: 10px; background: rgba(0,255,65,0.2); }

        /* Password Cracker (Idea 2) */
        .cracker-box { text-align: center; margin-top: 100px; }
        #pass-display { font-size: 3rem; letter-spacing: 10px; color: #fff; }
        .progress-bar { width: 80%; height: 20px; border: 1px solid var(--green); margin: 20px auto; position: relative; }
        #progress-fill { width: 0%; height: 100%; background: var(--green); transition: 0.1s; }

        /* Existing Styles */
        #canvas-rain { position: absolute; top:0; left:0; width: 100%; height: 100%; z-index: -1; }
        #terminal { width: 100%; height: 300px; background: #000; border: 1px solid #222; padding: 10px; color: var(--green); outline: none; overflow-y: auto; }
    </style>
</head>
<body>

    <div class="fs-note">PRESS F11 FOR FULL IMMERSION</div>
    
    <div class="control-panel">
        <button onclick="showView('v1')">01_MATRIX_RAIN</button>
        <button onclick="showView('v2')">02_TERMINAL_CMD</button>
        <button onclick="showView('v3')">03_NASA_BYPASS</button>
        <button onclick="showView('v4')" class="btn-red">04_REMOTE_ACCESS</button>
        <button onclick="showView('v6')">05_HOLLYWOOD_FX</button>
        <button onclick="showView('v7')">06_GLOBAL_CCTV</button>
        <button onclick="showView('v8')">07_PASS_CRACKER</button>
        <button onclick="toggleFullScreen()" style="border-color: #fff; color: #fff;">FORCE_FULLSCREEN</button>
    </div>

    <div id="v1" class="view-container"><canvas id="canvas-rain"></canvas></div>
    <div id="v2" class="view-container"><h3>TERMINAL</h3><div id="terminal" contenteditable="true">user@look-hacker:~$ </div></div>
    <div id="v3" class="view-container" style="text-align:center;"><h1 style="margin-top:100px; animation: flash 1s infinite;">[ SUCCESS ]<br>NASA Mainframe Bug Solved</h1></div>
    <div id="v4" class="view-container" style="text-align:center;"><h1 style="color:red; margin-top:100px; animation: flash 0.5s infinite;">!! WARNING !!<br>Remote Access Gained</h1></div>
    <div id="v6" class="view-container"><div id="h-grid" style="display:grid; grid-template-columns: 1fr 1fr 1fr; gap:5px;"></div></div>
    
    <div id="v7" class="view-container">
        <div class="cctv-grid" id="cctv-target"></div>
    </div>

    <div id="v8" class="view-container">
        <div class="cracker-box">
            <h2>DECRYPTING ENCRYPTED VOL_01</h2>
            <div id="pass-display">********</div>
            <div class="progress-bar"><div id="progress-fill"></div></div>
            <div id="status-text">STATUS: BRUTE-FORCING...</div>
        </div>
    </div>

    <script>
        function showView(id) {
            document.querySelectorAll('.view-container').forEach(v => v.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            if(id === 'v1') startRain();
            if(id === 'v7') startCCTV();
            if(id === 'v8') startCracker();
        }

        function toggleFullScreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen();
            } else {
                if (document.exitFullscreen) { document.exitFullscreen(); }
            }
        }

        // --- Idea 1: CCTV Logic ---
        function startCCTV() {
            const target = document.getElementById('cctv-target');
            target.innerHTML = '';
            const locations = ["TOKYO_HUB", "NYC_BANK", "LONDON_STREET", "PARIS_SERVER", "DUBAI_TOWER", "SEOUL_DATA"];
            locations.forEach(loc => {
                const cam = document.createElement('div');
                cam.className = 'cam';
                cam.innerHTML = `<div class="cam-label">${loc} - ${Math.floor(Math.random()*100)}% SIG</div>`;
                target.appendChild(cam);
                setInterval(() => { cam.style.opacity = Math.random() > 0.9 ? 0.5 : 1; }, 500);
            });
        }

        // --- Idea 2: Cracker Logic ---
        function startCracker() {
            let prog = 0;
            const fill = document.getElementById('progress-fill');
            const pass = document.getElementById('pass-display');
            const interval = setInterval(() => {
                prog += 1;
                fill.style.width = prog + "%";
                pass.innerText = Math.random().toString(36).substring(2, 10).toUpperCase();
                if(prog >= 100) {
                    clearInterval(interval);
                    pass.innerText = "ACCESS_GRANTED";
                    pass.style.color = "gold";
                }
            }, 100);
        }

        // --- Rain Logic ---
        function startRain() {
            const canvas = document.getElementById('canvas-rain');
            const ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth; canvas.height = window.innerHeight;
            const letters = "日0123456789ABCDEF";
            const fontSize = 16;
            const columns = canvas.width / fontSize;
            const drops = Array(Math.floor(columns)).fill(1);
            function draw() {
                ctx.fillStyle = "rgba(0, 0, 0, 0.05)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = "#0F0";
                ctx.font = fontSize + "px monospace";
                drops.forEach((y, i) => {
                    const text = letters[Math.floor(Math.random() * letters.length)];
                    ctx.fillText(text, i * fontSize, y * fontSize);
                    if (y * fontSize > canvas.height && Math.random() > 0.975) drops[i] = 0;
                    drops[i]++;
                });
            }
            setInterval(draw, 33);
        }
    </script>
</body>
</html>
